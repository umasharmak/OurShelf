<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThriftCircle — clickable prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF9;--card:#FFF;--line:#E4E1DC;--ink:#17171C;--grey:#6B6F76;--coral:#E36542;--coral-text:#C8442A;--pink:#D94668;--teal:#5CBEB1;--teal-tint:#DDF3F0;--amber:#F2A93B;--amber-tint:#FDEFD6;--coral-tint:#FBE9E3;--grey-tint:#ECEAE6;--grad:linear-gradient(90deg,#E36542,#D94668)}
*{box-sizing:border-box}
html,body{margin:0;background:#EFEDE9;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink)}
#app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:480px){#app{margin:16px auto;min-height:calc(100vh - 32px);border-radius:34px;border:1px solid var(--line);overflow:hidden}}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.brand{font:800 20px Manrope,sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.back{color:var(--grey);text-decoration:none;font-weight:500;padding:6px 0}
h1{font:800 26px/1.15 Manrope,sans-serif;margin:4px 0 0;overflow-wrap:anywhere}
h2{font:800 19px Manrope,sans-serif;margin:8px 0 0}
p{margin:0}.grey{color:var(--grey)}.small{font-size:14px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:block;text-decoration:none;color:inherit}
a.card:active{background:#F6F4F1}
.tile{display:flex;align-items:center;gap:12px}
.ic{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.ic.coral{background:var(--grad)}.ic.teal{background:var(--teal)}.ic.amber{background:var(--amber)}
.tile b{display:block;font:700 16px Manrope,sans-serif}.tile span{color:var(--grey);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font:600 12px Inter,sans-serif;color:var(--ink);white-space:nowrap}
.chip.teal{background:var(--teal-tint)}.chip.amber{background:var(--amber-tint)}.chip.coral{background:var(--coral-tint);color:var(--coral-text)}.chip.grey{background:var(--grey-tint);color:var(--grey)}.chip.name{max-width:150px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:16px;font:800 17px Manrope,sans-serif;text-decoration:none;border:0;cursor:pointer;width:100%;padding:0 14px}
.btn.grad{background:var(--grad);color:#fff}
.btn.outline{border:2px solid var(--coral);color:var(--coral-text);background:var(--card)}
.btn.wa{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--coral-text);font-weight:700;min-height:44px}
.btn.danger{background:var(--card);border:1px solid var(--line);color:var(--coral-text);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
label{display:block;font-size:13px;color:var(--grey);margin:0 0 4px;font-weight:500}
input,textarea,select{width:100%;font:15px Inter,sans-serif;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);min-height:48px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus,.btn:focus-visible,a[role=link]{cursor:pointer}a:focus-visible{outline:3px solid #F5B49E;outline-offset:2px}
.field{display:flex;flex-direction:column}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;text-decoration:none;color:inherit;display:block}
.ph{background:#EDEBE7;display:flex;align-items:center;justify-content:center;color:var(--grey);font-size:12px}
.item .ph{height:120px}
.item .t{padding:8px 10px 10px}
.item .t b{display:-webkit-box;font:700 14px/1.2 Manrope,sans-serif;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .p{font:800 15px Manrope,sans-serif;margin-top:2px}
.item .chip{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94)}
.item.sold .ph{filter:grayscale(1);opacity:.6}
.big{height:230px;border-radius:20px}
.price{font:800 28px Manrope,sans-serif}
.qr{height:130px;border:1px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--grey);font-size:12px;background:var(--card)}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:388px;margin:0 auto 12px;display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.tabs a{flex:1;text-align:center;font:600 13px Inter,sans-serif;padding:11px 0;border-radius:12px;color:var(--grey);text-decoration:none}
.tabs a.on{background:var(--grad);color:#fff;font-weight:700}
.line{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;text-decoration:none;color:inherit}
.line .ph{width:56px;height:56px;border-radius:12px;flex:none}
.line .t{flex:1;min-width:0}.line .t b{display:block;font:700 15px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{background:var(--coral-tint);color:var(--coral-text);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.ok{background:var(--teal-tint);border-radius:22px;padding:14px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.photos{display:flex;gap:8px}.photos .ph{flex:1;height:72px;border-radius:12px;border:1px dashed var(--line);cursor:pointer}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;min-height:0}
.skel{background:linear-gradient(90deg,#EDEBE7,#F6F4F1,#EDEBE7);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:22px;height:72px}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.ribbon{background:#FFF8E1;color:#5A4500;font-size:12px;padding:6px 16px;text-align:center}
</style></head><body>
<div id="app"><div class="ribbon">Prototype · fake data · nothing is saved after refresh</div><main id="main"></main><nav class="tabs" id="tabs"></nav></div>
<div class="toast" id="toast"></div>
<script>
// ---------- state ----------
const S={
 me:null, // {name,phone,upiId,upiQr}
 groups:[
  {id:'g1',name:'Indiranagar Preloved',code:'BLR-7K2M',admin:'u1',members:148},
  {id:'g2',name:'Koramangala 4th Block Residents Welfare Association Buy-Sell-Swap',code:'KOR-91AA',admin:'u9',members:412},
  {id:'g3',name:'Office Desk Clearout',code:'OFC-22ZP',admin:'u7',members:31},
 ],
 myGroups:['g1','g2','g3'],
 users:{u1:{name:'Uma'},u2:{name:'Priya S.'},u3:{name:'Rahul M.'},u4:{name:'Aaditya'},u5:{name:'Anjali K.'},u6:{name:'Meera Subramaniam Venkataraghavan'}},
 shops:[
  {id:'s1',seller:'u2',groups:['g1','g3'],closes:daysFromNow(5),area:'Indiranagar, near 12th Main',timings:'Weekdays after 7pm, Sat–Sun 10am–6pm',upiId:'priya.s@okaxis',upiQr:true,status:'open',opened:daysFromNow(-2)},
  {id:'s2',seller:'u3',groups:['g1'],closes:daysFromNow(1),area:'Domlur',timings:'Any evening',upiId:'',upiQr:true,status:'open',opened:daysFromNow(-6)},
  {id:'s3',seller:'u4',groups:['g1'],closes:daysFromNow(30),area:'',timings:'',upiId:'',upiQr:false,status:'open',opened:daysFromNow(0)},
  {id:'s0',seller:'u1',groups:['g1'],closes:daysFromNow(-14),area:'HSR Layout Sector 2',timings:'Weekends',upiId:'uma@upi',upiQr:true,status:'closed',opened:daysFromNow(-21)},
 ],
 items:[
  {id:'i1',shop:'s1',title:'Teak bookshelf',price:2500,cat:'Furniture',cond:'Good condition. Solid teak, 5 shelves, minor scratch on top. 6ft tall.',photos:3,status:'available',queue:[]},
  {id:'i2',shop:'s1',title:'Kindle Paperwhite',price:4000,cat:'Electronics',cond:'11th gen, 16GB, with cover. Battery fine.',photos:2,status:'available',queue:[]},
  {id:'i3',shop:'s1',title:'Set of 3 Uniqlo oversized cotton T-shirts size M, worn twice, no stains at all',price:600,cat:'Clothes',cond:'',photos:0,status:'reserved',queue:['u5','u3']},
  {id:'i4',shop:'s1',title:'Yoga mat',price:300,cat:'Other',cond:'',photos:1,status:'sold',queue:['u3']},
  {id:'i5',shop:'s1',title:'Atomic Habits (hardcover)',price:250,cat:'Books',cond:'Like new',photos:1,status:'available',queue:[]},
  {id:'i6',shop:'s2',title:'IKEA MARKUS office chair',price:6500,cat:'Furniture',cond:'Gas lift works. Some fabric wear on armrests.',photos:2,status:'available',queue:[]},
  {id:'i7',shop:'s2',title:'Nike Pegasus 40, UK 9',price:2200,cat:'Shoes',cond:'~200km run',photos:3,status:'available',queue:[]},
  {id:'i8',shop:'s0',title:'Blender (Philips)',price:1200,cat:'Electronics',cond:'',photos:1,status:'available',queue:[]},
  {id:'i9',shop:'s0',title:'Standing lamp',price:900,cat:'Furniture',cond:'',photos:1,status:'sold',queue:['u2']},
 ],
 pendingCode:'',
};
function daysFromNow(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d}
const fmtDate=d=>d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const daysLeft=d=>Math.ceil((d-new Date())/864e5);
const rupee=n=>'₹'+n.toLocaleString('en-IN');
const uname=id=>S.users[id]?.name||'Someone';const fname=id=>uname(id).split(' ')[0];
const myShop=()=>S.shops.find(s=>s.seller==='u1'&&s.status==='open');
const shopItems=id=>S.items.filter(i=>i.shop===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
let ROUTE='signin';function go(h){ROUTE=h;render()}
function timeChip(s){const n=daysLeft(s.closes);if(s.status==='closed'||n<=0)return `<span class="chip grey">Closed</span>`;if(n===1)return `<span class="chip coral">Closes tomorrow</span>`;return `<span class="chip amber">${n} days left</span>`}
function statusChip(i){return i.status==='sold'?`<span class="chip grey">Sold</span>`:i.status==='reserved'?`<span class="chip amber">Reserved</span>`:''}
function ph(n,cls){return `<div class="ph ${cls||''}">${n?'photo':'no photo'}</div>`}

// ---------- screens ----------
const V={};
V.signin=(q)=>{const step=q.step||'phone';return `
 <div class="top"><span class="brand">ThriftCircle</span></div>
 <h1>Buy and sell with people you already trust.</h1>
 <p class="grey">Nothing here is public — only your groups can see your shop.</p>
 ${step==='phone'?`
 <div class="field"><label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="numeric" placeholder="98765 43210" value="98765 43210"></div>
 <button class="btn grad" onclick="sendCode()">Send code</button>`:`
 <div class="field"><label for="otp">6-digit code sent to +91 98765 43210</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>
 ${q.err?`<div class="err">That code didn't match. Check the SMS and try again — ${q.err} tries left.</div>`:''}
 <button class="btn grad" onclick="verify()">Verify and continue</button>
 <p class="grey small center">Resend code in 0:28 · <a onclick="go('signin')" tabindex="0" role="link" style="color:var(--coral-text);font-weight:600">Change number</a></p>
 <p class="grey small center">Prototype: any code works; type 000000 to see the error.</p>`}`};
function sendCode(){go('signin?step=otp')}
function verify(){const v=document.getElementById('otp').value;if(v==='000000'){go('signin?step=otp&err=2');return}S.me={name:'Uma',phone:'+91 98765 43210',upiId:'uma@upi',upiQr:true};const pi=S.pendingItem;S.pendingItem=null;go(pi?'item?id='+pi:S.pendingCode?'join?code='+S.pendingCode:'home')}

V.join=(q)=>`
 <div class="top"><a class="back" onclick="go('home')" tabindex="0" role="link">← Back</a></div>
 <h1>Join a group</h1>
 <p class="grey">You need an invite code from a group admin. Codes look like <b>BLR-7K2M</b>.</p>
 <div class="field"><label for="code">Invite code</label><input id="code" value="${esc(q.code||'')}" placeholder="BLR-7K2M" style="text-transform:uppercase"></div>
 ${q.err?`<div class="err">That code isn't valid or has expired. Ask your admin for a fresh one.</div>`:''}
 ${q.found?(()=>{const g=S.groups.find(x=>x.id===q.found);return `<div class="card"><b style="font:700 17px Manrope,sans-serif">${esc(g.name)}</b><br><span class="grey small">${g.members} members · admin ${esc(uname(g.admin))}</span><button class="btn grad" style="margin-top:12px" onclick="joinGroup('${g.id}')">Yes, join this group</button></div>`})():`<button class="btn grad" onclick="checkCode()">Find group</button>`}
 <p class="grey small center" style="margin-top:12px">Prototype codes: BLR-7K2M · KOR-91AA · OFC-22ZP · anything else fails.</p>
 <div class="card" style="margin-top:auto"><b style="font:700 15px Manrope,sans-serif">Have an admin code?</b><p class="grey small">Admins can create a new group.</p>
  <div class="two" style="margin-top:10px"><div class="field"><label>Admin code</label><input placeholder="ADM-…"></div><div class="field"><label>Group name</label><input id="gname" placeholder="e.g. Tower B Swap"></div></div>
  <button class="btn outline" style="margin-top:10px" onclick="createGroup()">Create group</button></div>`;
function checkCode(){const c=document.getElementById('code').value.trim().toUpperCase().replace(/\s/g,'');const g=S.groups.find(x=>x.code===c);go(g?`join?code=${c}&found=${g.id}`:`join?code=${c}&err=1`)}
function joinGroup(id){if(!S.myGroups.includes(id))S.myGroups.push(id);toast('Joined');go('group?id='+id)}
function createGroup(){const n=document.getElementById('gname').value.trim()||'New group';const id='g'+Date.now();S.groups.push({id,name:n,code:'NEW-'+Math.random().toString(36).slice(2,6).toUpperCase(),admin:'u1',members:1});S.myGroups.push(id);toast('Group created');go('group?id='+id)}

V.home=()=>{const gs=S.myGroups.map(id=>S.groups.find(g=>g.id===id));const ms=myShop();return `
 <div class="top"><span class="brand">ThriftCircle</span><a class="chip grey name" onclick="go('profile')" tabindex="0" role="link" style="text-decoration:none">${esc(S.me.name)}</a></div>
 <h1>Hey, ${esc(S.me.name.split(' ')[0])}! 👋</h1><p class="grey">What would you like to do today?</p>
 <a class="card tile" onclick="go('${ms?'myshop':'openshop'}')" tabindex="0" role="link"><div class="ic coral">🛍</div><div><b>${ms?'My shop':'Open a shop'}</b><span>${ms?`${shopItems(ms.id).length} items · ${daysLeft(ms.closes)} days left`:'Sell for a few days'}</span></div></a>
 <a class="card tile" onclick="go('join')" tabindex="0" role="link"><div class="ic teal">👥</div><div><b>Join a group</b><span>Enter invite code</span></div></a>
 <a class="card tile" onclick="go('profile')" tabindex="0" role="link"><div class="ic amber">🏠</div><div><b>My profile</b><span>Name and UPI details</span></div></a>
 <h2>My groups</h2>
 ${gs.length?gs.map(g=>{const open=S.shops.filter(s=>s.status==='open'&&s.groups.includes(g.id));return `<a class="card row" onclick="go('group?id=${g.id}')" tabindex="0" role="link"><div style="min-width:0"><b style="font:700 16px Manrope,sans-serif;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</b><span class="grey small">${open.length?`${open.length} shop${open.length>1?'s':''} open`:'No shops open right now'}</span></div>${g.admin==='u1'?'<span class="chip teal">Admin</span>':''}</a>`}).join(''):`<div class="card"><p>You're not in any group yet. Enter the invite code your admin shared.</p><a class="btn grad" onclick="go('join')" tabindex="0" role="link" style="margin-top:10px">Join a group</a></div>`}`};

V.group=(q)=>{const g=S.groups.find(x=>x.id===q.id);if(!g)return `<div class="err">This group no longer exists.</div><a class="btn outline" onclick="go('home')" tabindex="0" role="link">Back to home</a>`;const open=S.shops.filter(s=>s.status==='open'&&s.groups.includes(g.id));return `
 <div class="top"><a class="back" onclick="go('home')" tabindex="0" role="link">← Groups</a>${g.admin==='u1'?'<span class="chip teal">Admin</span>':''}</div>
 <h1 style="font-size:22px">${esc(g.name)}</h1>
 ${g.admin==='u1'?`<div class="card row" style="padding:10px 14px"><span class="grey small">Invite code <b style="color:var(--ink)">${g.code}</b></span><div style="display:flex;gap:6px"><button class="chip coral" style="border:0;cursor:pointer" onclick="toast('Copied')">Copy</button><button class="chip coral" style="border:0;cursor:pointer" onclick="toast('Opens WhatsApp share sheet')">Share ↗</button><button class="chip grey" style="border:0;cursor:pointer" onclick="newCode('${g.id}')">New code</button></div></div>`:''}
 <h2>Open shops</h2>
 ${open.length?open.map(s=>{const it=shopItems(s.id);return `<a class="card" onclick="go('shop?id=${s.id}')" tabindex="0" role="link"><div class="row"><b style="font:700 16px Manrope,sans-serif">${esc(fname(s.seller))}'s shop</b>${timeChip(s)}</div><span class="grey small">${it.length} item${it.length!==1?'s':''}${it.filter(i=>i.status==='sold').length?` · ${it.filter(i=>i.status==='sold').length} sold`:''} · ${s.area?esc(s.area):'<span style="color:var(--coral-text)">pickup area not set</span>'}</span></a>`}).join(''):`<div class="card"><p>No shops open in this group. Be the first.</p></div>`}
 ${myShop()?'':`<a class="btn grad" onclick="go('openshop?g=${g.id}')" tabindex="0" role="link" style="margin-top:8px">Open a shop here</a>`}`};
function newCode(id){const g=S.groups.find(x=>x.id===id);g.code=g.code.split('-')[0]+'-'+Math.random().toString(36).slice(2,6).toUpperCase();toast('New invite code — old one stops working');render()}

V.shop=(q)=>{const s=S.shops.find(x=>x.id===q.id);if(!s)return `<div class="err">This link isn't valid. Ask the seller to share it again.</div><a class="btn outline" onclick="go('home')" tabindex="0" role="link">Back to home</a>`;const it=shopItems(s.id).sort((a,b)=>({available:0,reserved:1,sold:2}[a.status]-{available:0,reserved:1,sold:2}[b.status]));const closed=s.status==='closed'||daysLeft(s.closes)<=0;return `
 <div class="top"><a class="back" onclick="go(S.me?'group?id=${s.groups[0]}':'signin')" tabindex="0" role="link">← ${S.me?'Group':'Sign in'}</a><button class="chip coral" style="border:0;cursor:pointer" onclick="toast('Opens WhatsApp with the shop link')">Share ↗</button></div>
 <h1 style="font-size:24px">${esc(fname(s.seller))}'s shop</h1>
 ${closed?`<div class="err">This shop closed on ${fmtDate(s.closes)}. Items are no longer available.</div>`:''}
 <div class="card" style="padding:12px 14px">${timeChip(s)}<p class="grey small" style="margin-top:8px">📍 ${s.area?esc(s.area):'Pickup area not set yet'}<br>🕖 ${s.timings?esc(s.timings):'Timings not set yet'}</p></div>
 ${s.seller==='u1'?`<a class="btn outline" onclick="go('myshop')" tabindex="0" role="link">Manage my shop</a>`:`<button class="btn wa" onclick="toast('Opens WhatsApp chat with ${esc(uname(s.seller))}')">💬 Message ${esc(uname(s.seller).split(' ')[0])} on WhatsApp</button>`}
 ${!S.me?`<p class="grey small center">You're viewing as a guest. Sign in to reserve an item.</p>`:''}
 ${it.length?`<p class="grey small">${it.length} items · available first</p><div class="items">${it.map(i=>`<a class="item ${i.status}" onclick="go('item?id=${i.id}')" tabindex="0" role="link">${statusChip(i)}${ph(i.photos)}<div class="t"><b>${esc(i.title)}</b><div class="p">${rupee(i.price)}</div></div></a>`).join('')}</div>`:`<div class="card"><p>${esc(uname(s.seller))} hasn't added items yet. Check back soon.</p></div>`}`};

V.item=(q)=>{const i=S.items.find(x=>x.id===q.id);const s=S.shops.find(x=>x.id===i.shop);const mine=s.seller==='u1';const closed=s.status==='closed'||daysLeft(s.closes)<=0;const pos=i.queue.indexOf('u1');const first=i.queue[0];return `
 <div class="top"><a class="back" onclick="go('shop?id=${s.id}')" tabindex="0" role="link">← ${esc(fname(s.seller))}'s shop</a><span class="chip grey">${i.photos?`1 / ${i.photos}`:'no photo'}</span></div>
 <div class="ph big">${i.photos?'photo · swipe':'no photo'}</div>
 <div class="row"><span class="price">${rupee(i.price)}</span><span class="chip teal">${i.cat}</span></div>
 <b style="font:700 17px Manrope,sans-serif">${esc(i.title)}</b>
 ${i.cond?`<p class="grey">${esc(i.cond)}</p>`:''}
 <div class="card" style="padding:10px 14px"><p class="grey small">📍 ${s.area?esc(s.area):'Pickup area not set'} · 🕖 ${s.timings?esc(s.timings):'timings not set'}</p></div>
 ${mine?`<a class="btn outline" onclick="go('claims?id=${i.id}')" tabindex="0" role="link">Manage this item</a>`:
  !S.me?`<button class="btn grad" onclick="S.pendingItem='${i.id}';go('signin')">Sign in to reserve</button>`:
  closed?`<div class="err">This shop has closed.</div>`:
  i.status==='sold'?`<div class="card grey center">Sold${i.queue[0]==='u1'?' — to you 🎉':''}</div>`:
  pos===0?`<div class="ok"><b style="font:800 16px Manrope,sans-serif">It's yours! 🎉</b><p class="grey small">Pay ${rupee(i.price)} to ${esc(uname(s.seller))} via UPI, then arrange pickup.</p>${s.upiQr?'<div class="qr" style="margin:10px 0">UPI QR</div>':''}${s.upiId?`<div class="row"><span class="grey small">${esc(s.upiId)}</span><button class="chip coral" style="border:0;cursor:pointer" onclick="toast('UPI ID copied')">Copy</button></div>`:''}${!s.upiQr&&!s.upiId?'<p class="grey small">Seller hasn\'t added UPI details — ask on WhatsApp.</p>':''}</div>
   <button class="btn grad" onclick="toast('Opens WhatsApp chat with ${esc(uname(s.seller))}')">💬 Message ${esc(uname(s.seller).split(' ')[0])} on WhatsApp</button>
   <button class="btn ghost" onclick="withdraw('${i.id}')">Changed your mind? Release it</button>`:
  pos>0?`<div class="card"><b style="font:700 16px Manrope,sans-serif">You're #${pos+1} in line</b><p class="grey small">${esc(uname(first))} has it reserved. If it frees up, it's yours next — we'll show it here.</p></div><button class="btn ghost" onclick="withdraw('${i.id}')">Leave the line</button>`:
  i.status==='reserved'?`<div class="card"><b style="font:700 16px Manrope,sans-serif">Reserved by someone else</b><p class="grey small">${i.queue.length>1?`${i.queue.length-1} waiting.`:'Nobody waiting yet.'} Join the line in case it frees up.</p></div><button class="btn outline" onclick="claim('${i.id}')">Join the line</button>`:
  `<button class="btn grad" onclick="claim('${i.id}')">I'll take it</button><p class="grey small center">First to tap gets it. You'll see the seller's UPI details right away.</p>`}`};
function claim(id){const i=S.items.find(x=>x.id===id);if(i.status==='sold'){toast('Just sold — sorry!');render();return}i.queue.push('u1');if(i.status==='available'){i.status='reserved';toast("Reserved for you")}else toast(`You're #${i.queue.length} in line`);render()}
function withdraw(id){const i=S.items.find(x=>x.id===id);i.queue=i.queue.filter(u=>u!=='u1');i.status=i.queue.length?'reserved':'available';toast(i.queue.length?'Passed to the next person':'Released');render()}

V.myshop=()=>{const s=myShop();if(!s){const exp=S.shops.find(x=>x.seller==='u1'&&x.status==='open'===false&&daysLeft(x.closes)<=0&&daysLeft(x.closes)>-3);return `
 <div class="top"><span class="brand">ThriftCircle</span></div><h1>My shop</h1>
 <div class="card"><p>You don't have a shop open. Opening one takes about a minute.</p><a class="btn grad" onclick="go('openshop')" tabindex="0" role="link" style="margin-top:10px">Open a shop</a></div>
 <p class="grey small center">Past shops and unsold items are under <a onclick="go('history')" tabindex="0" role="link" style="color:var(--coral-text);font-weight:600">History</a>.</p>`}
 const it=shopItems(s.id);const c={available:0,reserved:0,sold:0};it.forEach(i=>c[i.status]++);const gs=s.groups.map(g=>S.groups.find(x=>x.id===g)?.name).filter(Boolean);return `
 <div class="top"><span class="brand">ThriftCircle</span><a class="chip grey name" onclick="go('profile')" tabindex="0" role="link" style="text-decoration:none">${esc(S.me.name)}</a></div>
 <h1>My shop</h1>
 <div class="card"><div class="row">${timeChip(s)}<span class="grey small">closes ${fmtDate(s.closes)}</span></div><p class="grey small" style="margin-top:6px">Posted in: ${gs.map(esc).join(', ')}</p>
  <div class="two" style="margin-top:12px"><button class="btn wa" style="min-height:44px;font-size:15px" onclick="toast('Opens WhatsApp with the shop link')">💬 Share</button><button class="btn wa" style="min-height:44px;font-size:15px" onclick="extend('${s.id}')">+7 days</button></div></div>
 <a class="btn grad" onclick="go('additem')" tabindex="0" role="link">+ Add item</a>
 ${it.length?`<p class="grey small">${it.length} items · ${c.available} available · ${c.reserved} reserved · ${c.sold} sold</p>
 ${it.map(i=>`<a class="line" onclick="go('claims?id=${i.id}')" tabindex="0" role="link">${ph(i.photos)}<div class="t"><b>${esc(i.title)}</b><span class="grey small">${rupee(i.price)} · ${i.status==='sold'?`Sold to ${esc(uname(i.queue[0]))}`:i.status==='reserved'?`<span style="color:var(--coral-text);font-weight:600">Reserved for ${esc(uname(i.queue[0]))}</span>${i.queue.length>1?` · ${i.queue.length-1} waiting`:''}`:'Available'}</span></div><span class="chip ${i.status==='sold'?'grey':i.status==='reserved'?'amber':'teal'}">${i.status==='sold'?'Sold':i.status==='reserved'?'Reserved':'Open'}</span></a>`).join('')}`:`<div class="card"><p>Your shop is open but empty. Add your first item — a photo and a price is enough.</p></div>`}
 <button class="btn danger" style="margin-top:8px" onclick="closeShop('${s.id}')">Close shop early</button>`};
function extend(id){const s=S.shops.find(x=>x.id===id);s.closes=new Date(s.closes.getTime()+7*864e5);toast('Extended to '+fmtDate(s.closes));render()}
function closeShop(id){if(!confirm('Close your shop now? Unsold items move to History and can be re-listed later.'))return;const s=S.shops.find(x=>x.id===id);s.status='closed';s.closes=new Date();toast('Shop closed');go('history')}

V.openshop=(q)=>{const gs=S.myGroups.map(id=>S.groups.find(g=>g.id===id));return `
 <div class="top"><a class="back" onclick="go('home')" tabindex="0" role="link">← Back</a></div>
 <h1>Open a shop</h1>
 <div class="field"><label>Shop closes in</label><div class="two" style="grid-template-columns:1fr 1fr 1fr"><button class="btn wa" style="min-height:44px" data-d="3" onclick="pickDays(this)">3 days</button><button class="btn grad" style="min-height:44px" data-d="7" onclick="pickDays(this)">7 days</button><button class="btn wa" style="min-height:44px" data-d="14" onclick="pickDays(this)">14 days</button></div><input type="hidden" id="days" value="7"></div>
 <div class="field"><label for="area">Pickup area</label><input id="area" placeholder="e.g. Indiranagar, near 12th Main" value=""></div>
 <div class="field"><label for="tm">Pickup timings</label><input id="tm" placeholder="e.g. Weekdays after 7pm, weekends 10–6"></div>
 <div class="card"><b style="font:700 15px Manrope,sans-serif">Post to</b>
  ${gs.length>1?gs.map(g=>`<label class="check" style="font-size:15px;color:var(--ink);margin:0"><input type="checkbox" class="gsel" value="${g.id}" ${(!q.g||q.g===g.id)?'checked':''}><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</span></label>`).join(''):`<p class="grey small">${esc(gs[0]?.name||'')}</p><input type="checkbox" class="gsel" value="${gs[0]?.id}" checked hidden>`}</div>
 <div class="card"><b style="font:700 15px Manrope,sans-serif">How buyers pay you</b><p class="grey small">Shown only to the person who reserves an item.</p>
  <div class="qr" style="margin:10px 0">${S.me.upiQr?'UPI QR from your profile · tap to replace':'Upload UPI QR image'}</div>
  <div class="field"><label for="upi">UPI ID (optional)</label><input id="upi" value="${esc(S.me.upiId||'')}" placeholder="name@bank"></div></div>
 <div id="oserr"></div>
 <button class="btn grad" onclick="openShop()">Open shop and add items</button>`};
function pickDays(b){document.querySelectorAll('[data-d]').forEach(x=>{x.className='btn wa';x.style.minHeight='44px'});b.className='btn grad';document.getElementById('days').value=b.dataset.d}
function openShop(){const area=document.getElementById('area').value.trim();const gs=[...document.querySelectorAll('.gsel:checked')].map(x=>x.value);const e=document.getElementById('oserr');if(!area){e.innerHTML='<div class="err">Add a pickup area so buyers know roughly where to collect.</div>';return}if(!gs.length){e.innerHTML='<div class="err">Pick at least one group to post in.</div>';return}
 S.shops.push({id:'s'+Date.now(),seller:'u1',groups:gs,closes:daysFromNow(+document.getElementById('days').value),area,timings:document.getElementById('tm').value.trim(),upiId:document.getElementById('upi').value.trim(),upiQr:S.me.upiQr,status:'open',opened:new Date()});toast('Shop is open');go('additem')}

V.additem=(q)=>{const s=myShop();if(!s)return `<div class="err">Open a shop first, then add items.</div><a class="btn grad" onclick="go('openshop')" tabindex="0" role="link">Open a shop</a>`;const ed=q.id?S.items.find(x=>x.id===q.id):null;return `
 <div class="top"><a class="back" onclick="go('myshop')" tabindex="0" role="link">← My shop</a></div>
 <h1>${ed?'Edit item':'Add item'}</h1>
 <div class="field"><label>Photos (1–3)</label><div class="photos" id="photos">${[0,1,2].map(n=>`<div class="ph" data-n="${n}" onclick="togglePhoto(this)" style="${n<(ed?ed.photos:0)?'background:#DDF3F0;border-style:solid':''}">${n<(ed?ed.photos:0)?'photo':(n===0?'📷 Take / choose':'+')}</div>`).join('')}</div><p class="grey small">Prototype: tap a box to add or remove a photo.</p></div>
 <div class="field"><label for="title">Title</label><input id="title" maxlength="120" value="${esc(ed?.title||'')}" placeholder="e.g. Teak bookshelf" oninput="document.getElementById('cnt').textContent=this.value.length+'/120'"><span class="grey small" id="cnt" style="text-align:right">${(ed?.title||'').length}/120</span></div>
 <div class="two"><div class="field"><label for="price">Price (₹)</label><input id="price" type="number" inputmode="numeric" min="0" value="${ed?.price??''}" placeholder="500"></div>
 <div class="field"><label for="cat">Category</label><select id="cat">${['Clothes','Shoes','Electronics','Books','Furniture','Other'].map(c=>`<option ${ed?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
 <div class="field"><label for="cond">Condition (optional)</label><textarea id="cond" placeholder="e.g. Good. Minor scratch on top.">${esc(ed?.cond||'')}</textarea></div>
 <div id="aierr"></div>
 <button class="btn grad" onclick="saveItem('${ed?.id||''}',true)">${ed?'Save changes':'Save and add another'}</button>
 ${ed?'':`<button class="btn outline" onclick="saveItem('',false)">Save and finish</button>`}`};
function togglePhoto(el){const on=el.style.background;if(on){el.style.background='';el.style.borderStyle='dashed';el.textContent=el.dataset.n==='0'?'📷 Take / choose':'+'}else{el.style.background='#DDF3F0';el.style.borderStyle='solid';el.textContent='photo'}}
function saveItem(id,another){const s=myShop();const photos=[...document.querySelectorAll('#photos .ph')].filter(p=>p.style.background).length;const title=document.getElementById('title').value.trim();const price=+document.getElementById('price').value;const e=document.getElementById('aierr');
 if(!photos){e.innerHTML='<div class="err">Add at least one photo. Items without photos rarely sell.</div>';return}if(!title){e.innerHTML='<div class="err">Give it a short title so buyers know what it is.</div>';return}if(!(price>0)){e.innerHTML='<div class="err">Enter a price above ₹0. Giving it away? Use ₹1.</div>';return}
 const data={title,price,cat:document.getElementById('cat').value,cond:document.getElementById('cond').value.trim(),photos};
 if(id){Object.assign(S.items.find(x=>x.id===id),data);toast('Saved');go('myshop');return}
 S.items.push({id:'i'+Date.now(),shop:s.id,status:'available',queue:[],...data});toast('Item added');go(another?'additem?t='+Date.now():'myshop')}

V.claims=(q)=>{const i=S.items.find(x=>x.id===q.id);const first=i.queue[0];const rest=i.queue.slice(1);return `
 <div class="top"><a class="back" onclick="go('myshop')" tabindex="0" role="link">← My shop</a><a class="chip grey" onclick="go('additem?id=${i.id}')" tabindex="0" role="link" style="text-decoration:none">Edit</a></div>
 <div class="line">${ph(i.photos)}<div class="t"><b>${esc(i.title)}</b><span class="grey small">${rupee(i.price)} · ${i.cat}</span></div></div>
 ${i.status==='sold'?`<div class="ok"><b style="font:800 16px Manrope,sans-serif">Sold to ${esc(uname(first))} ✓</b><p class="grey small">Marked sold. It's greyed out for everyone.</p></div><button class="btn ghost" onclick="unsell('${i.id}')">Undo — mark as available</button>`:
 i.status==='reserved'?`<div class="card"><span class="chip amber">Reserved</span><b style="font:700 17px Manrope,sans-serif;display:block;margin-top:8px">${esc(uname(first))}</b><p class="grey small">Reserved it first. They've seen your UPI details.</p><button class="btn wa" style="margin-top:10px" onclick="toast('Opens WhatsApp chat with ${esc(uname(first))}')">💬 WhatsApp ${esc(uname(first).split(' ')[0])}</button></div>
  <button class="btn grad" onclick="confirmSold('${i.id}')">Confirm sold to ${esc(uname(first).split(' ')[0])}</button>
  <button class="btn danger" onclick="release('${i.id}')">${rest.length?`Release to next (${esc(uname(rest[0]))})`:'Release — make available again'}</button>
  ${rest.length?`<p class="grey small">Waiting: ${rest.map(u=>esc(uname(u))).join(', ')}</p>`:''}`:
 `<div class="card"><p>No one has reserved this yet. Share the shop again?</p><button class="btn wa" style="margin-top:10px" onclick="toast('Opens WhatsApp with the shop link')">💬 Share shop</button></div>
  <button class="btn outline" onclick="soldOutside('${i.id}')">Sold it outside the app</button>`}
 <button class="btn ghost" onclick="delItem('${i.id}')">Remove item</button>`};
function confirmSold(id){const i=S.items.find(x=>x.id===id);i.status='sold';toast('Marked sold');render()}
function release(id){const i=S.items.find(x=>x.id===id);i.queue.shift();i.status=i.queue.length?'reserved':'available';toast(i.queue.length?'Passed to '+uname(i.queue[0]):'Available again');render()}
function soldOutside(id){const i=S.items.find(x=>x.id===id);i.status='sold';i.queue=['u0'];S.users.u0={name:'someone outside the app'};toast('Marked sold');render()}
function unsell(id){const i=S.items.find(x=>x.id===id);i.status=i.queue.length&&i.queue[0]!=='u0'?'reserved':'available';if(i.queue[0]==='u0')i.queue=[];render()}
function delItem(id){if(!confirm('Remove this item from your shop?'))return;S.items=S.items.filter(x=>x.id!==id);toast('Removed');go('myshop')}

V.history=()=>{const closed=S.shops.filter(s=>s.seller==='u1'&&s.status==='closed');return `
 <div class="top"><span class="brand">ThriftCircle</span></div><h1>History</h1>
 ${closed.length?closed.map(s=>{const it=shopItems(s.id);const unsold=it.filter(i=>i.status!=='sold');return `<div class="card"><div class="row"><b style="font:700 16px Manrope,sans-serif">Shop closed ${fmtDate(s.closes)}</b><span class="chip grey">${it.filter(i=>i.status==='sold').length} sold · ${unsold.length} unsold</span></div>
  ${unsold.length?`<p class="grey small" style="margin:10px 0 6px">Unsold — re-list into your current shop</p>${unsold.map(i=>`<div class="line" style="margin-bottom:8px">${ph(i.photos)}<div class="t"><b>${esc(i.title)}</b><span class="grey small">${rupee(i.price)}</span></div><button class="chip coral" style="border:0;cursor:pointer;min-height:36px" onclick="relist('${i.id}')">Re-list</button></div>`).join('')}`:''}</div>`}).join(''):`<div class="card"><p>Nothing here yet. Your closed shops and unsold items will show up here.</p></div>`}`};
function relist(id){const s=myShop();if(!s){if(confirm('You need an open shop to re-list. Open one now?'))go('openshop');return}const i=S.items.find(x=>x.id===id);i.shop=s.id;i.status='available';i.queue=[];toast('Re-listed in your shop');go('myshop')}

V.profile=()=>`
 <div class="top"><a class="back" onclick="go('home')" tabindex="0" role="link">← Back</a></div><h1>Profile</h1>
 <div class="field"><label for="nm">Display name (what buyers see)</label><input id="nm" maxlength="40" value="${esc(S.me.name)}"></div>
 <div class="field"><label>Mobile</label><input value="${S.me.phone}" disabled><span class="grey small">Can't be changed — it's how you sign in.</span></div>
 <div class="card"><b style="font:700 15px Manrope,sans-serif">Saved UPI details</b><p class="grey small">Pre-filled when you open a shop.</p><div class="qr" style="margin:10px 0">${S.me.upiQr?'UPI QR · tap to replace':'Upload UPI QR image'}</div><div class="field"><label for="pupi">UPI ID</label><input id="pupi" value="${esc(S.me.upiId||'')}" placeholder="name@bank"></div></div>
 <div class="card"><b style="font:700 15px Manrope,sans-serif">Groups</b>${S.myGroups.map(id=>{const g=S.groups.find(x=>x.id===id);return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</span><button class="chip grey" style="border:0;cursor:pointer" onclick="leave('${g.id}')">Leave</button></div>`}).join('')}</div>
 <button class="btn grad" onclick="saveProfile()">Save</button>
 <button class="btn ghost" onclick="S.me=null;go('signin')">Sign out</button>`;
function saveProfile(){S.me.name=document.getElementById('nm').value.trim()||S.me.name;S.me.upiId=document.getElementById('pupi').value.trim();toast('Saved');go('home')}
function leave(id){if(S.myGroups.length===1&&!confirm('This is your only group. Leave anyway?'))return;S.myGroups=S.myGroups.filter(g=>g!==id);toast('Left group');render()}

// ---------- router ----------
function parse(){const h=ROUTE||'signin';const [name,qs]=h.split('?');const q={};(qs||'').split('&').forEach(p=>{if(!p)return;const [k,v]=p.split('=');q[decodeURIComponent(k)]=decodeURIComponent(v||'')});return {name,q}}
const PUBLIC=['signin','shop','item'];
function render(){const {name,q}=parse();const m=document.getElementById('main');const tabs=document.getElementById('tabs');
 if(!S.me&&!PUBLIC.includes(name)){if(name==='join'&&q.code)S.pendingCode=q.code;ROUTE='signin';return render()}
 if(S.me&&name==='signin'){ROUTE=S.pendingItem?'item?id='+S.pendingItem:'home';S.pendingItem=null;return render()}
 m.innerHTML='<div class="skel"></div><div class="skel"></div>';
 setTimeout(()=>{m.innerHTML=(V[name]||V.home)(q);window.scrollTo(0,0)},name==='signin'?0:250);
 const show=S.me&&!['signin','join','openshop','additem','profile','claims'].includes(name);tabs.style.display=show?'flex':'none';
 const on=['home','group','shop','item'].includes(name)?'home':['myshop'].includes(name)?'myshop':name==='history'?'history':'';
 tabs.innerHTML=`<a onclick="go('home')" tabindex="0" role="link" class="${on==='home'?'on':''}">Home</a><a onclick="go('myshop')" tabindex="0" role="link" class="${on==='myshop'?'on':''}">My shop</a><a onclick="go('history')" tabindex="0" role="link" class="${on==='history'?'on':''}">History</a>`}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=link]'))e.target.click()});render();
</script>
</body></html>
